name: Validate (latest)

# Weekly drift check (opsalert#34): the suite on whatever PyPI resolves today,
# with NO ci-constraints.txt. It runs only on a schedule or by hand, so it can
# never be a required check. A failure files (or comments on) one open issue;
# the gate is unaffected because validate / validate-light install under
# ci-constraints.txt (vingapi's lock pins).

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (unconstrained)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] ruff mypy
      - name: Resolved versions
        run: pip freeze
      - name: Lint (ruff)
        run: ruff check opsalert/ tests/
      - name: Type check (mypy)
        run: mypy opsalert/
      - name: Tests (pytest)
        run: pytest tests/ -q
      - name: Report drift by issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='validate-latest: the suite fails on unconstrained dependency versions'
          number=$(gh issue list --state open --search "in:title \"$title\"" \
            --json number,title --limit 100 \
            | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            body=$(printf '%s\n\n%s\n\n%s\n' \
              "The weekly unconstrained run (validate-latest.yml) failed: $RUN_URL" \
              "It installs \`pip install -e .[dev] ruff mypy\` with no constraints, so a dependency released since the last run broke ruff, mypy or the suite on the latest versions." \
              "The gate is unaffected: validate and validate-light install under \`ci-constraints.txt\` (vingapi's requirements.lock pins). Fix before vingapi bumps to the versions that fail.")
            gh issue create --title "$title" --label testing --body "$body"
          fi
