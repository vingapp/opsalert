name: Validate

on:
  pull_request:
    branches: [integration, staging, main]
  merge_group:
    branches: [integration]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets (gitleaks)
        env:
          GITLEAKS_BIN_DIR: ${{ runner.temp }}/bin
          GITLEAKS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          GITLEAKS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: bash scripts/gates/gitleaks.sh ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] ruff mypy pip-audit
      - name: Lint (ruff)
        run: ruff check opsalert/ tests/
      - name: Type check (mypy)
        run: mypy opsalert/
      - name: Tests (pytest)
        run: pytest tests/ -q
      - name: Dependency audit (pip-audit)
        run: pip-audit
